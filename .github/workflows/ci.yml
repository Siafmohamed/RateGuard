name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository. The deploy workflow declares
# its own (larger) permissions.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Node version is not hard-coded here: it is read from
      # frontend/package.json -> "engines.node" (the same field npm enforces).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The same dist/ that docker-compose bind-mounts into php + nginx.
      - name: Upload built SPA
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # Matches the MySQL image pinned in docker-compose.yml. Note that the test
    # suite does NOT use this service: phpunit.xml forces
    # DB_CONNECTION=sqlite / DB_DATABASE=:memory: (along with array cache,
    # sync queue, array sessions and mail), so no Redis and no WordPress are
    # required either. The service is here so a future MySQL-backed test can
    # opt in by overriding the phpunit env.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: rateguard_test
          MYSQL_USER: rateguard
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PHP version comes from api/composer.json -> "require.php" (^8.3).
      # Extensions mirror docker/php/Dockerfile, plus pdo_sqlite for the
      # in-memory test database.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, exif, gd, intl, mbstring, opcache, pcntl, zip, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.3-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Only .env.example is committed, so this creates the throwaway .env
      # inside the runner's checkout and mints a fresh APP_KEY for it.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run test suite
        run: php artisan test
