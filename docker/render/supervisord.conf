; Self-contained supervisord config for the single-container Render image.
;
; It is passed with `-c` explicitly, so the Debian package default
; (/etc/supervisor/supervisord.conf) is never consulted: that file logs to a
; file on the ephemeral disk, and here every log has to reach Render through the
; container's stdout/stderr instead.

[supervisord]
nodaemon=true
user=root
pidfile=/var/run/supervisord.pid
; Only supervisor's own messages go here. Each program logs separately below,
; so /dev/null keeps the noise out without losing child output.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autorestart=true
; php-fpm exits immediately on a bad pool config; without startsecs it would
; restart-loop and flood the log instead of reporting the failure once.
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
