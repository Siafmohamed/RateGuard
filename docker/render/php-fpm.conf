; php-fpm pool overrides for the Render free plan (0.1 CPU / 512 MB).
;
; This file is installed as /usr/local/etc/php-fpm.d/zz-render.conf, so it is
; read after the php image's own docker.conf and these values win.

[www]
listen = 127.0.0.1:9000

; 512 MB is shared by nginx, php-fpm and Laravel. A Laravel worker settles
; around 40-60 MB and PHP's default memory_limit is 128 MB, so four children
; covers a worst case of ~512 MB while still absorbing the handful of API calls
; the SPA fires in parallel on first load.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2

; Recycle workers periodically: this service is expected to stay up for long
; stretches between spin-downs.
pm.max_requests = 500

; Laravel reads its configuration from the container environment, so the pool
; must not scrub it. The php image already sets this in docker.conf; it is
; repeated here so the requirement sits next to the other overrides.
clear_env = no

; Surface worker warnings and fatals in the container log.
catch_workers_output = yes
decorate_workers_output = no
