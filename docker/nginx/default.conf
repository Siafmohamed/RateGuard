server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 6M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # /blog, /docs, /sitemap.xml and /robots.txt have no matching files under
    # public/, so they fall through to Laravel via this block. /robots.txt is
    # deliberately NOT served as a static file any more: Laravel owns it (see
    # routes/web.php) so the Sitemap line always points at config('app.url').
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Static assets of the built SPA (mounted read-only at /var/www/spa from
    # ./frontend/dist). Vite emits content-hashed bundles under /assets/, so
    # the filename changes whenever the content does: cache them for a year.
    location /assets/ {
        root /var/www/spa;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Not hashed, so a much shorter cache.
    location = /favicon.svg {
        root /var/www/spa;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 300;

        # buffer settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
